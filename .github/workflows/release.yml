name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025-vs2026
            args: --target x86_64-pc-windows-msvc --bundles nsis
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload build artifacts (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: motrix-next-${{ matrix.label }}
          path: "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe"
          retention-days: 7
